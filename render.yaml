services:
  - type: web
    name: rag-knowledge-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: DB_POOL_MAX_SIZE
        value: "5"
